        </h1>
        <p class="intro">前端工程师，开发过 Canvas 动画和前端工具链，最近在折腾 AI Agent。</p>
        <p class="motto">且视他人之疑目如盏盏鬼火，大胆地去走你<span class="nw">的夜路。</span></p>
      </header>

      <section class="block rise d2" aria-labelledby="like-title">
        <h2 id="like-title">兴趣</h2>
        <div class="lines">
          <p><span class="pill">动画</span><span>偏爱日常、青春与音乐题材，奇幻偶尔也看，每季挑几部<span class="nw">新番追。</span></span></p>
          <p><span class="pill">游戏</span><span>Type-Moon 厨，怪猎和泰拉瑞亚玩得最久，也爱魂系动作和 Roguelike。</span></p>
          <p><span class="pill">生活</span><span>平时喜欢下厨，在学日语，也会去动画取景地巡礼；想去<span class="nw">南极看看。</span></span></p>
        </div>
      </section>

      <figure class="remark block rise d3">
        <blockquote>
          <p>前端出身，却总在边界外折腾：用 Go 和 SwiftUI 写自己的桌面与 iOS 客户端，用 Rust 写 CLI，给巡礼地图接上 MCP，给 QQ 机器人做<span class="nw">直播提醒。</span></p>
          <p>做的东西不大，但多半是先解决自己的问题，再<span class="nw">顺手开源。</span></p>
        </blockquote>
