<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === "light" ? "#f3efe8" : "#141414";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", theme === "light" ? "#f3efe8" : "#141414");
        }
      })();
    </script>
    <meta name="robots" content="noindex" />
    <title>找不到 · 柒宇</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <button type="button" class="theme" id="theme-toggle">浅色</button>
    <div class="sky" aria-hidden="true">
      <canvas id="startrack"></canvas>
      <div class="veil"></div>
    </div>
    <main id="content">
      <header class="hero">
        <h1>找不到</h1>
        <p class="intro">这条路没有。回到有灯的地方。</p>
        <p class="more"><a href="/">回主页</a></p>
      </header>
    </main>
    <script src="/bg.js"></script>
    <script src="/theme.js"></script>
  </body>
</html>
